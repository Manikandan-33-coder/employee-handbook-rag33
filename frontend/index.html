<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AI Assistant"
    >

    <title>AI Assistant</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div class="background-glow glow-one"></div>

    <div class="background-glow glow-two"></div>



    <!-- =====================================================
         MAIN PAGE
    ====================================================== -->

    <main class="page">


        <!-- =================================================
             PHONE FRAME
        ================================================== -->

        <section class="phone-frame">


            <!-- =================================================
                 HEADER
            ================================================== -->

            <header class="app-header">


                <!-- HEADER LEFT -->

                <div class="header-left">


                    <!-- AI LOGO -->

                    <div class="company-logo">
                        ✦
                    </div>


                    <!-- AI ASSISTANT NAME -->

                    <div class="company-info">

                        <h1>
                            AI Assistant
                        </h1>

                        <span>
                            Employee Handbook
                        </span>

                    </div>


                </div>



                <!-- HEADER RIGHT -->

                <div class="header-right">


                    <!-- ONLINE STATUS -->

                    <div class="online-status">

                        <span class="online-dot"></span>

                        Online

                    </div>


                    <!-- CLEAR CHAT -->

                    <button
                        type="button"
                        id="clearChat"
                        class="icon-button"
                        title="New Chat"
                        aria-label="New Chat"
                    >

                        ↻

                    </button>


                </div>


            </header>



            <!-- =================================================
                 CHAT AREA
            ================================================== -->

            <div
                class="chat-area"
                id="chatArea"
            >


                <!-- =================================================
                     WELCOME
                ================================================== -->

                <section
                    class="welcome"
                    id="welcome"
                >


                    <!-- AI ICON -->

                    <div class="ai-orb">


                        <div class="orb-inner">

                            ✦

                        </div>


                    </div>


                    <!-- ONLY WELCOME TEXT -->

                    <h2>
                        How can I help you?
                    </h2>


                </section>



                <!-- =================================================
                     CHAT MESSAGES
                ================================================== -->

                <section
                    id="chatMessages"
                    class="chat-messages"
                    aria-live="polite"
                >

                    <!--
                        JavaScript will insert
                        user and assistant messages here.
                    -->

                </section>



                <!-- =================================================
                     LOADING
                ================================================== -->

                <div
                    id="loading"
                    class="loading hidden"
                >


                    <div class="message-avatar">

                        ✦

                    </div>


                    <div class="loading-bubble">


                        <div class="loading-dots">

                            <span></span>

                            <span></span>

                            <span></span>

                        </div>


                        <span>
                            Searching handbook...
                        </span>


                    </div>


                </div>


            </div>



            <!-- =================================================
                 INPUT AREA
            ================================================== -->

            <footer class="input-area">


                <form
                    id="questionForm"
                    class="question-form"
                >


                    <!-- INPUT -->

                    <div class="input-wrapper">


                        <span class="input-symbol">
                            ✦
                        </span>


                        <input
                            type="text"
                            id="questionInput"
                            placeholder="Ask anything..."
                            autocomplete="off"
                            required
                        >


                    </div>



                    <!-- SEND -->

                    <button
                        type="submit"
                        id="askButton"
                        class="send-button"
                        aria-label="Send question"
                    >

                        →

                    </button>


                </form>



                <!-- INPUT HINT -->

                <div class="input-hint">

                    <span>
                        AI Assistant
                    </span>

                    <span>
                        •
                    </span>

                    <span>
                        RAG
                    </span>

                </div>


            </footer>



            <!-- =================================================
                 BOTTOM NAVIGATION
            ================================================== -->

            <nav class="bottom-nav">


                <div class="nav-item active">

                    <span class="nav-icon">
                        ✦
                    </span>

                    <span>
                        Assistant
                    </span>

                </div>


                <div class="nav-divider"></div>


                <div class="nav-item">

                    <span class="nav-icon">
                        ◫
                    </span>

                    <span>
                        Handbook
                    </span>

                </div>


            </nav>


        </section>


    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>


</body>

</html>
